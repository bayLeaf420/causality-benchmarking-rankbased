# Default system: 6 x 6 x 6 grid inside the region where CCC resolves the
# direction (K >= 1, mu >= 0.5), 40 realisations of 1500 samples at dt = 0.1.
system:
  grid:
    beta: [0.25, 2.25, 6]   # damping of the driven oscillator: [start, stop, num]
    K: [1.0, 2.6, 6]        # frequency ratio driver / driven
    mu: [0.5, 2.5, 6]       # coupling strength
  simulation:
    tau: [0.0, 150.0, 1500]            # time window: [start, stop, samples]
    mean_init: [1.0, 0.0, -1.3, 0.0]   # initial mean of (x1, v1, x2, v2)
    sigma_init: [0.25, 0.25, 0.25, 0.25]
    q1: 0.1                 # noise power on v1
    q2: 0.1                 # noise power on v2
    beta2: 0.0              # driver damping; 0 = pure SHO (non-stationary)
    stationary: false
    burn_in: 0
    n_realisations: 40
    seed: 0
    sample_dtype: float32
    realisation_block: 8
