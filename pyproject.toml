[project]
name = "lkif-rank-causal-bench"
version = "0.1.0"
description = "Ranks heuristic causality measures (GC, TE, CCC, PCMCI, CCM) against Liang-Kleeman information flow on coupled oscillators"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffrax==0.7.2",
    "jax==0.10.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "sympy==1.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# src layout: lkif_rank_causal_bench (the benchmark) and algorithms (the CCC
# implementation and the legacy symbolic LKIF, kept untouched) are found under src/.
package-dir = {"" = "src"}
py-modules = ["oscillators"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.0.3",
    "ruff>=0.8",
]
# Estimators used only by the experiments in claude_tests/ (Kraskov TE via
# IDTxl, PCMCI via tigramite, which needs joblib).
experiments = [
    "idtxl",
    "joblib>=1.6.0",
    "tigramite>=5.2.10.1",
]

[tool.uv]
default-groups = ["dev", "experiments"]

[tool.uv.sources]
# IDTxl is not on PyPI; pinned to the commit the experiments ran with.
idtxl = { git = "https://github.com/pwollstadt/IDTxl", rev = "c7eacfd9ce5ca6cdb371e19a52ea286db0d33f3c" }

[tool.uv.extra-build-dependencies]
# IDTxl's setup.py imports Cython (and numpy) but does not declare them.
idtxl = ["cython", "numpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: cross-validation against the symbolic LKIF matrix (~30 s per point)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# untouched code: the CCC implementation, legacy modules and historical scripts
extend-exclude = ["src/algorithms", "src/oscillators.py", "experiments", "claude_tests", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D"]
# N802/N803/N806: physics names (K, A, Q, P, G, Sigma) keep their usual capitals
ignore = ["N802", "N803", "N806", "D203", "D213", "D413", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.pyright]
include = ["src/lkif_rank_causal_bench", "tests"]
exclude = ["src/algorithms", "src/oscillators.py", "experiments", "claude_tests", "docs"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
